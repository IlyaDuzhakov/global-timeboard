<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline — Global Timeboard</title>

    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #06152b;
        color: white;
        font-family: Arial, sans-serif;
        text-align: center;
        padding: 24px;
      }

      .card {
        max-width: 460px;
        padding: 32px;
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.08);
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
      }

      .icon {
        font-size: 64px;
        margin-bottom: 14px;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 32px;
      }

      p {
        margin: 0 0 22px;
        font-size: 18px;
        line-height: 1.5;
      }

      button {
        padding: 12px 22px;
        border: none;
        border-radius: 14px;
        background: #ffbf00;
        color: #06152b;
        font-size: 16px;
        font-weight: 800;
        cursor: pointer;
      }
    </style>
  </head>

  <body>
    <main class="card">
      <div class="icon">📡</div>

      <h1>Нет подключения к интернету</h1>

      <p>
        Global Timeboard не смог загрузить эту страницу. Проверьте подключение и
        попробуйте снова.
      </p>

      <button onclick="window.location.href = '/global-timeboard/'">
        На главную
      </button>
    </main>
  </body>
</html>
